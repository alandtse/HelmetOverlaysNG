; HelmetOverlaysNG configuration
; Install to Data/SKSE/Plugins/HelmetOverlaysNG.ini

[General]
bEnabled=true
; Overlay art root, relative to Data: <root>\<armor world model path without .nif>.dds
sOverlayRoot=Interface\overlays
; Draw only while the camera is first person. VR is always first person.
bFirstPersonOnly=true
; Fade out while inventory/map/dialogue/etc. menus are open.
bHideInMenus=true
; Stop the other Helmet Overlays (ScribeOverlays.esp) widget on load so a second
; overlay does not draw. Keep its ESP/art installed.
bSuppressOriginal=true
; Leave wigs (hair slot alone, not named like a hood or hat) and circlets out of the coverage scan, and never
; draw an overlay for them.
bSkipWigs=true
bSkipCirclets=true
; Shows the Debug page in the in-game menu.
bDebugTools=true
; Flat screen only: skip shading the scene behind the overlay's fully opaque pixels to save GPU time.
; VR occlusion is provided by imgui-vr-helper.
; The margin is how far inside the opaque area the mask stops, in pixels of the 1920x1080 art.
bOpaqueMask=true
iMaskMarginPx=8

[Appearance]
; 0.0 - 1.0 overall opacity.
fOpacity=1.0
; Uniform scale about screen center; 1.0 = cover the screen with the 16:9 art.
fScale=1.0
; Vertical placement as a fraction of the display height; positive moves the art down.
fVerticalOffset=0.0
; Stretch the art's edge pixels over any gap that the scale or placement opens at the screen edge.
bExtendEdges=true

[Light]
; Dim the art with the light level around the player. Fully black parts of the art stay black.
bReactive=true
; Darkening at zero light: 0.0 none, 1.0 black.
fStrength=0.25
; Seconds to move to a new light level.
fFadeSeconds=1.0
; Seconds between light level reads.
fIntervalSeconds=1.0
; Shift the art toward the color of the scene around the screen edges (firelight, lightning).
bScreenTint=true
; 0 keeps the art's own color, 1 takes the full hue.
fScreenTintStrength=1.0

[Animation]
; Fade | Settle | Slide
sStyle=Settle
fFadeInSeconds=0.35
fFadeOutSeconds=0.20
; Flat only: overlay lags behind camera motion. Never applied in VR.
bSway=false
fSwayStrength=1.0
; Flat only: short nudges when you jump, strafe or start sprinting.
bMotion=true
fMotionStrength=1.0

[VR]
; Head-locked visor plane, in metres. Needs imgui-vr-helper.
; Values below 0.01 m (including 0) use 0.01 m.
fDepthMeters=0.1
; How far the visor plane reaches past the view; 1.0 ends at the edge, higher pushes the frame off
; screen so no gap shows. The art is scaled to match, so this does not enlarge the eye openings.
fCoverage=1.25
; 0 keeps the art's proportions as on a flat screen; 1 stretches it to fill each eye's view.
fStretch=0.5

[Sound]
; Scale both effects by helmet type: closed helms muffle fully, open helmets and hoods less.
; Uses the armor class and how much of the overlay art is see-through. The art weight is how
; much the overlay outweighs the armor class (0 = armor class only, 1 = overlay only).
bAutoStrength=true
fAutoArtWeight=0.65
; Two independent effects while a helmet is worn.
; Volume attenuation: lower world-sound effect volume.
bAttenuate=true
fAttenuateVolume=0.6
fAttenuateSeconds=0.5
; Low-pass "distortion": rolls off highs on every non-music sound via XAudio2, in place of
; the game's own distance muffling while worn. Cutoff is the value reached at full helmet; 8000 is fully open.
bLowPass=true
fLowPassHz=2930

[Menus]
; Menus that fade the overlay out while open (when bHideInMenus is on). Semicolon-separated, using
; the game's menu names; edit in-game under Helmet Overlays NG > Menus. Menus that show the world
; (tween, inventory and other item menus, magic, favorites, dialogue) are left out on purpose.
sHidden=Journal Menu;MapMenu;StatsMenu;LevelUp Menu;Lockpicking Menu;Book Menu;Sleep/Wait Menu;Training Menu;Crafting Menu;RaceSex Menu;Loading Menu;Main Menu;Console;MessageBoxMenu;Credits Menu;Creation Club Menu;Mod Manager Menu;TitleSequence Menu
