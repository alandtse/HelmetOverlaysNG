; HelmetOverlaysNG configuration
; Install to Data/SKSE/Plugins/HelmetOverlaysNG.ini

[General]
bEnabled=true
; Overlay art root, relative to Data. Matches Helmet Overlays / Enhanced Edition:
; <root>\<armor world model path without .nif>.dds
sOverlayRoot=Interface\overlays
; Draw only while the camera is first person (flat). VR is always first person.
bFirstPersonOnly=true
; Fade out while inventory/map/dialogue/etc. menus are open.
bHideInMenus=true
; Stop the original Helmet Overlays (ScribeOverlays.esp) quests on load so its SWF
; widget doesn't draw a second overlay. Keep its ESP/art installed.
bSuppressOriginal=true

[Appearance]
; 0.0 - 1.0 overall opacity ("darkness" in the original MCM).
fOpacity=1.0
; Uniform scale about screen center; 1.0 = cover the screen with the 16:9 art.
fScale=1.0

[Animation]
; Fade | Settle | Slide
sStyle=Settle
fFadeInSeconds=0.35
fFadeOutSeconds=0.20
; Flat only: overlay lags behind camera motion. Never applied in VR.
bSway=true
fSwayStrength=1.0

[VR]
; Head-locked visor plane (needs imgui-vr-helper with interface 006; older helpers
; fall back to their global HUD plane). Most lenses can't focus nearer than ~0.5 m.
fDepthMeters=0.6
; Fraction of each eye's view the plane fills; > 1 over-fills so no edge gap shows.
fCoverage=1.15

[Sound]
; Two independent effects while a helmet is worn.
; Volume attenuation: lower world-sound category volumes (effects, footsteps).
bAttenuate=true
fAttenuateVolume=0.6
fAttenuateSeconds=0.5
; Low-pass "distortion": rolls off highs on every non-music sound via XAudio2, on top of
; the game's own distance filtering. Cutoff is the value reached at full helmet; 8000 is fully open.
bLowPass=false
fLowPassHz=1800

[Menus]
; Menus that fade the overlay out while open (when bHideInMenus is on). Semicolon-separated;
; edit in-game under Helmet Overlays NG > Menus.
sHidden=InventoryMenu;MagicMenu;ContainerMenu;BarterMenu;GiftMenu;MapMenu;StatsMenu;TweenMenu;Journal Menu;LevelUp Menu;Lockpicking Menu;BookMenu;Sleep/Wait Menu;Training Menu;Crafting Menu;RaceSex Menu;Loading Menu;MainMenu;Console;MessageBoxMenu;FavoritesMenu
